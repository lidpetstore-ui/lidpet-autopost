name: T2 no schedule
# Lidpet: 1 post kol nhar f Instagram, Facebook, Pinterest w TikTok.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Tjriba bla ma yposti walo (1 = ah)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: lidpet-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Make creatives (ghir les posts jdad)
        run: python scripts/make_creatives.py

      - name: Push creatives (Instagram/Facebook/Pinterest kayjbdo les tsawer men GitHub)
        run: |
          git config user.name "lidpet-autopost"
          git config user.email "lidpet-autopost@users.noreply.github.com"
          git add ready
          git diff --cached --quiet || (git commit -m "creatives: new posts" && git push)
          sleep 20

      - name: Post
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODE: inbox
        run: python scripts/post.py

      - name: Save progress
        if: always()
        run: |
          git add -A posts done
          git diff --cached --quiet || (git commit -m "autopost: progress" && git pull --rebase && git push)
